<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Glass Aquarium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a1628;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .ui-button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ui-button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        #title-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        #title-overlay h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        #title-overlay p {
            font-size: 13px;
            opacity: 0.7;
            font-weight: 300;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            font-size: 12px;
            opacity: 0.5;
            pointer-events: none;
            line-height: 1.6;
        }
        #fps-counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            color: white;
            font-size: 12px;
            opacity: 0.5;
            font-family: 'Courier New', monospace;
            pointer-events: none;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 18px;
            z-index: 200;
        }
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.3) 100%);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="vignette"></div>
    <div id="title-overlay">
        <h1>Living Glass Aquarium</h1>
        <p>A procedural Three.js underwater world</p>
    </div>
    <div id="ui-overlay">
        <button class="ui-button" id="reset-view">Reset View</button>
        <button class="ui-button" id="pause-btn">Pause</button>
    </div>
    <div id="instructions">
        Drag to orbit &bull; Scroll to zoom &bull; Right-drag to pan<br>
        <strong>Space</strong> Pause/Resume &bull; <strong>R</strong> Reset View
    </div>
    <div id="fps-counter">-- fps</div>
    <div id="loading">Loading aquarium...</div>

    <script>
        const loading = document.getElementById('loading');
        window.aquariumStage = 'Loading JavaScript and Three.js';
        window.aquariumFailed = false;
        window.showAquariumError = (error) => {
            window.aquariumFailed = true;
            loading.style.display = 'block';
            loading.style.maxWidth = '90vw';
            loading.style.whiteSpace = 'pre-wrap';
            loading.style.background = '#0a1628';
            loading.style.padding = '20px';
            loading.textContent = 'Unable to start the aquarium.\nStage: ' + window.aquariumStage + '\n' + (error?.stack || error?.message || String(error));
            console.error(error);
        };
        window.addEventListener('error', event => {
            if (event.message || event.error) window.showAquariumError(event.error || event.message);
        });
        window.addEventListener('unhandledrejection', event => window.showAquariumError(event.reason));
        setTimeout(() => {
            if (!window.aquariumFailed && loading.style.display !== 'none') {
                loading.textContent = 'Loading is taking longer than expected. Stage: ' + window.aquariumStage;
            }
        }, 15000);
    </script>
    <script src="./aquarium.bundle.js" onerror="window.showAquariumError('Unable to load aquarium.bundle.js. Keep it next to index.html.')"></script>
</body>
</html>
